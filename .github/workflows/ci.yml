name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-tests:
    name: dbt build (dbt-duckdb ${{ matrix.dbt-duckdb-version }}, dbt-core ${{ matrix.dbt-core-label }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          # floor: oldest dbt-duckdb (see README "Known issues") with the oldest
          # dbt-core it installs with, matching require-dbt-version
          - dbt-duckdb-version: "1.10.0"
            dbt-core-label: "1.8"
            dbt-core-spec: "dbt-core==1.8.*"
          # latest stable dbt-duckdb, with whatever dbt-core it resolves
          - dbt-duckdb-version: "1.11.1"
            dbt-core-label: "latest"
            dbt-core-spec: "dbt-core"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dbt-duckdb (matrix version)
        run: |
          uv venv
          # Pin duckdb==2.0.0 explicitly: the semantic_views community-extension
          # build is duckdb-version-specific, and v0.15.0+ runs only on DuckDB 2.0.
          # Pinning keeps CI deterministic (avoids floating onto a duckdb release
          # with no published extension build, which 404s on auto-install).
          uv pip install "dbt-duckdb==${{ matrix.dbt-duckdb-version }}" "${{ matrix.dbt-core-spec }}" "duckdb==2.0.0"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: dbt deps
        working-directory: integration_tests
        run: dbt deps --profiles-dir .

      - name: dbt seed
        working-directory: integration_tests
        run: dbt seed --profiles-dir . --target ci

      - name: dbt build (run + test in one process — required for file-backed lifecycle)
        working-directory: integration_tests
        run: dbt build --profiles-dir . --target ci

      - name: dbt build (re-run — verifies CREATE OR REPLACE idempotency)
        working-directory: integration_tests
        run: dbt build --profiles-dir . --target ci

      - name: Upload target/ on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target-${{ matrix.dbt-duckdb-version }}
          path: integration_tests/target/
          if-no-files-found: ignore
          retention-days: 7
